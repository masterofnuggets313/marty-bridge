[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "marty-bridge"
version = "0.2.0"
description = "Руки агента в браузере и в Telegram: локальный мост, расширение Chrome, команды"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Marty Bridge contributors" }]
keywords = ["browser", "automation", "cdp", "agent", "chrome-extension", "telegram"]
dependencies = []

[project.optional-dependencies]
telegram = ["pywinauto>=0.6.8", "pyperclip>=1.8", "pillow>=10"]
cdp = ["websocket-client>=1.7"]
dev = ["pytest>=8"]

[project.scripts]
mb = "mbridge.cli:main"

[tool.setuptools.packages.find]
include = ["mbridge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
